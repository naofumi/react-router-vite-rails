name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Typecheck
        working-directory: frontend
        run: npm ci && npm run typecheck

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --run

      - name: Build the production SPA
        working-directory: frontend
        env:
          RAILS_ENV: production
        run: npm run build

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential git pkg-config libyaml-dev

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      # No system tests are checked in (test/system is empty), so this does not
      # install Chrome. `test:system` still runs and passes with zero tests.
      - name: Run tests
        env:
          RAILS_ENV: test
        run: bin/rails db:test:prepare test test:system

      - name: Verify Puma startup
        env:
          PORT: 3100
          RAILS_ENV: test
        run: |
          log="$RUNNER_TEMP/puma.log"
          bundle exec puma -C config/puma.rb > "$log" 2>&1 &
          puma_pid=$!
          trap 'kill "$puma_pid" 2>/dev/null || true; cat "$log"' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail --max-time 2 --output /dev/null http://127.0.0.1:3100/up; then
              exit 0
            fi
            if ! kill -0 "$puma_pid" 2>/dev/null; then
              exit 1
            fi
            sleep 1
          done
          exit 1

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore
